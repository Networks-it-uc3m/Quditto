[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qd2-node-dev"
version = "2.1.1.dev6"
description = "Software for Quditto node"
authors = [ { name="Javier Perez", email="javier.perez@imdea.org"}, {name="Blanca Lopez", email="blanca.lopez@imdea.org"}, {name="Angela Diaz", email="angela.diaz@imdea.org"},]
requires-python = ">=3.8"
dependencies = [ 
    "pika ~=1.3.2",
    "aio_pika ~= 9.5.5",
    "uvicorn ~= 0.34.0",
    "fastapi ~= 0.115.11",
    "hvac ~= 2.3.0",
    "requests ~= 2.31.0",
    "scapy ~= 2.6.1",
    "cryptography ~= 46.0.3"
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/qd2_node",
]



